<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ExploreKosovo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <section class="auth">
    <div class="auth-box">
      <a href="index.html" class="logo">&#9650; Explore<span>Kosovo</span></a>
      <h2>Create account</h2>
      <p>Save destinations, write reviews and share places you love.</p>

      <!-- Later: action="registerlogic.php" method="post" -->
      <form action="#" method="post">
        <input type="text" name="fullname" placeholder="Full name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="password" name="confirm" placeholder="Confirm password" required>
        <input type="submit" value="Register">
      </form>

      <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </section>

</body>
</html>
